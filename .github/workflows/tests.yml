name: Causiq Automated Test Suite & CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite (FastAPI & Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run Backend Pytest Suite with Coverage
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests --cov=app --cov-report=term-missing --cov-report=xml:backend/coverage.xml --cov-fail-under=80

      - name: Upload Backend Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  frontend-tests:
    name: Frontend Test Suite (Vitest & React Testing Library)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Component & Unit Tests with Coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Run Type Check & Production Build
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
